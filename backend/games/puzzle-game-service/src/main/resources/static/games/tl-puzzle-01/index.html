<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Picture Puzzles · Tiny Leaps</title>
<style>
  :root { --ink:#3D3357; --bg:#FFF6EC; --card:#FFFFFF; --accent:#FF8A65; --mint:#B2EBF2; --sun:#FFD54F; --shadow:0 6px 0 rgba(61,51,87,.12); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
    font-family:'Arial Rounded MT Bold','Trebuchet MS',Verdana,system-ui,sans-serif; touch-action:none; }
  .bar { position:fixed; top:0; left:0; right:0; height:64px; display:flex; align-items:center; gap:12px; padding:0 14px;
    padding-top:env(safe-area-inset-top); z-index:50; }
  .bar h1 { flex:1; margin:0; font-size:22px; text-align:center; }
  .btn { width:48px; height:48px; border-radius:50%; border:0; background:var(--card); box-shadow:var(--shadow);
    display:grid; place-items:center; cursor:pointer; padding:0; }
  .btn svg { width:26px; height:26px; }
  .btn:active, .card:active, .pill:active { transform:translateY(3px); box-shadow:0 3px 0 rgba(61,51,87,.12); }
  .screen { position:absolute; inset:64px 0 0 0; overflow-y:auto; padding:12px 16px 24px; display:none; touch-action:pan-y; }
  .screen.on { display:block; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:16px; max-width:720px; margin:0 auto; }
  .card { background:var(--card); border-radius:24px; box-shadow:var(--shadow); padding:10px; border:0; cursor:pointer;
    text-align:center; color:var(--ink); font:inherit; position:relative; }
  .card img { width:100%; aspect-ratio:1; border-radius:16px; display:block; }
  .card .name { margin-top:8px; font-size:17px; }
  .card .done { position:absolute; top:4px; right:4px; width:34px; height:34px; border-radius:50%; background:var(--sun);
    display:grid; place-items:center; box-shadow:0 3px 0 rgba(61,51,87,.15); }
  .themes .card img { aspect-ratio:1; }
  .themes .card .name { font-size:22px; margin:10px 0 4px; }
  .pills { display:flex; justify-content:center; gap:12px; margin:0 auto 16px; }
  .pill { border:0; border-radius:999px; padding:10px 18px; background:var(--card); box-shadow:var(--shadow); font:inherit;
    font-size:17px; color:var(--ink); display:flex; align-items:center; gap:8px; cursor:pointer; }
  .pill.sel { background:var(--accent); color:#fff; }
  .pill svg { width:22px; height:22px; }
  #play { padding:0; overflow:hidden; touch-action:none; }
  #board { position:absolute; border-radius:18px; background:#fff; box-shadow:var(--shadow); overflow:hidden; }
  #board img { position:absolute; inset:0; width:100%; height:100%; opacity:.22; filter:grayscale(.3); }
  #board .slot { position:absolute; border:2px dashed rgba(61,51,87,.18); border-radius:6px; }
  #tray { position:absolute; border-radius:22px; background:rgba(178,235,242,.55); }
  .piece { position:absolute; left:0; top:0; transform-origin:0 0; border-radius:8px; touch-action:none;
    box-shadow:0 4px 10px rgba(61,51,87,.25); transition:transform .25s cubic-bezier(.2,.9,.3,1.3); will-change:transform; }
  .piece.drag { transition:none; box-shadow:0 12px 24px rgba(61,51,87,.35); }
  .piece.locked { box-shadow:none; border-radius:0; transition:transform .18s ease-out; }
  #win { position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:80; background:rgba(255,246,236,.6); }
  #win.on { display:flex; }
  #win .panel { background:#fff; border-radius:32px; padding:24px; width:min(88vw,360px); text-align:center; box-shadow:var(--shadow);
    animation:pop .5s cubic-bezier(.2,.9,.3,1.4); }
  #win h2 { margin:6px 0; font-size:38px; color:var(--accent); }
  #win img { width:70%; border-radius:18px; }
  #win .row { display:flex; justify-content:center; gap:18px; margin-top:14px; }
  #win .btn { width:64px; height:64px; }
  #win .btn svg { width:34px; height:34px; }
  #confetti { position:fixed; inset:0; pointer-events:none; z-index:90; }
  @keyframes pop { from { transform:scale(.6); opacity:0 } to { transform:scale(1); opacity:1 } }
  @keyframes wiggle { 0%,100% { transform:rotate(0) } 25% { transform:rotate(-4deg) } 75% { transform:rotate(4deg) } }
  .hint { text-align:center; font-size:15px; opacity:.7; margin:0 0 12px; }
</style>
</head>
<body>
<div class="bar">
  <button class="btn" id="back" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="#3D3357" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <h1 id="title">Picture Puzzles</h1>
  <button class="btn" id="sound" aria-label="Sound"></button>
</div>

<section class="screen on" id="menu"><div class="grid themes" id="themes"></div></section>
<section class="screen" id="picker">
  <div class="pills" id="levels"></div>
  <div class="grid" id="pictures"></div>
</section>
<section class="screen" id="play"><div id="board"></div><div id="tray"></div></section>

<div id="win"><div class="panel">
  <h2>Hooray!</h2><img id="winImg" alt=""><p id="winName" style="font-size:20px;margin:10px 0 0"></p>
  <div class="row">
    <button class="btn" id="again" aria-label="Play again"><svg viewBox="0 0 24 24" fill="none" stroke="#3D3357" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg></button>
    <button class="btn" id="next" aria-label="Next puzzle" style="background:#FF8A65"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</div></div>
<canvas id="confetti"></canvas>

<script src="/games/tl-puzzle-01/assets/art.js?v=1"></script>
<script>
(function () {
  'use strict';
  var A = window.TLArt;
  var THEMES = [
    { key: 'animals', name: 'Animals', list: A.animals },
    { key: 'alphabets', name: 'Alphabets', list: A.alphabets },
    { key: 'cars', name: 'Cars', list: A.cars }
  ];
  var LEVELS = [{ n: 2, label: '4' }, { n: 3, label: '9' }];
  var $ = function (id) { return document.getElementById(id); };
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem('tl-puzzle:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem('tl-puzzle:' + k, JSON.stringify(v)); } catch (e) {} }
  };
  var state = { screen: 'menu', theme: null, pic: null, level: store.get('level', 2), soundOn: store.get('sound', true) };
  var urlCache = {};
  function picUrl(pic) {
    if (!urlCache[pic.id]) urlCache[pic.id] = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(A.toSvg(pic, 'color').replace('width="400" height="400"', 'width="1200" height="1200"'));
    return urlCache[pic.id];
  }

  /* ---------- sound (generated, no downloads) ---------- */
  var ctx = null;
  function tone(freq, dur, delay, type) {
    if (!state.soundOn) return;
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      var t = ctx.currentTime + (delay || 0), o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + dur + 0.05);
    } catch (e) {}
  }
  var sfx = {
    pick: function () { tone(520, 0.12, 0, 'triangle'); },
    snap: function () { tone(660, 0.12); tone(880, 0.18, 0.08); },
    miss: function () { tone(260, 0.18, 0, 'triangle'); },
    win: function () { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.3, i * 0.13, 'triangle'); }); }
  };
  function drawSoundIcon() {
    $('sound').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#3D3357" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="#FFD54F"/>' +
      (state.soundOn ? '<path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>') + '</svg>';
  }
  $('sound').onclick = function () { state.soundOn = !state.soundOn; store.set('sound', state.soundOn); drawSoundIcon(); sfx.pick(); };
  drawSoundIcon();

  /* ---------- navigation ---------- */
  function show(screen, title) {
    state.screen = screen;
    ['menu', 'picker', 'play'].forEach(function (s) { $(s).classList.toggle('on', s === screen); });
    $('title').textContent = title;
  }
  function exitGame() {
    if (window.TinyLeaps && window.TinyLeaps.postMessage) window.TinyLeaps.postMessage(JSON.stringify({ type: 'exit', game: 'tl-puzzle-01' }));
    else history.back();
  }
  $('back').onclick = function () {
    sfx.pick();
    if (state.screen === 'play') { closeWin(); openTheme(state.theme); }
    else if (state.screen === 'picker') openMenu();
    else exitGame();
  };

  function card(img, name, done, onClick) {
    var b = document.createElement('button'); b.className = 'card';
    b.innerHTML = '<img alt="" src="' + img + '"><div class="name"></div>' +
      (done ? '<div class="done"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.4 7L12 17.6 5.8 21.1l1.4-7L2 9.3l7-.8z" fill="#fff" stroke="#3D3357" stroke-width="1.6" stroke-linejoin="round"/></svg></div>' : '');
    b.querySelector('.name').textContent = name;
    b.onclick = function () { sfx.pick(); onClick(); };
    return b;
  }

  function openMenu() {
    show('menu', 'Picture Puzzles');
    var box = $('themes'); box.innerHTML = '';
    THEMES.forEach(function (t) { box.appendChild(card(picUrl(t.list[0]), t.name, false, function () { openTheme(t); })); });
  }

  function openTheme(t) {
    state.theme = t;
    show('picker', t.name);
    var lv = $('levels'); lv.innerHTML = '';
    LEVELS.forEach(function (l) {
      var p = document.createElement('button'); p.className = 'pill' + (state.level === l.n ? ' sel' : '');
      var cells = ''; var s = 18 / l.n;
      for (var i = 0; i < l.n; i++) for (var j = 0; j < l.n; j++)
        cells += '<rect x="' + (3 + j * s) + '" y="' + (3 + i * s) + '" width="' + (s - 1.5) + '" height="' + (s - 1.5) + '" rx="1.5" fill="currentColor"/>';
      p.innerHTML = '<svg viewBox="0 0 24 24">' + cells + '</svg>' + l.label + ' pieces';
      p.onclick = function () { state.level = l.n; store.set('level', l.n); sfx.pick(); openTheme(t); };
      lv.appendChild(p);
    });
    var done = store.get('done', {});
    var grid = $('pictures'); grid.innerHTML = '';
    t.list.forEach(function (pic) {
      grid.appendChild(card(picUrl(pic), pic.letter ? pic.name.charAt(0) + pic.name.charAt(0).toLowerCase() : pic.name,
        done[pic.id + ':' + state.level], function () { startPuzzle(pic); }));
    });
  }

  /* ---------- puzzle ---------- */
  var game = null;
  function startPuzzle(pic) {
    state.pic = pic;
    show('play', pic.name);
    var img = new Image();
    img.onload = function () {
      var order = []; for (var k = 0; k < state.level * state.level; k++) order.push(k);
      for (var i = order.length - 1; i > 0; i--) { var r = Math.floor(Math.random() * (i + 1)); var tmp = order[i]; order[i] = order[r]; order[r] = tmp; }
      game = { pic: pic, img: img, n: state.level, placed: {}, order: order, z: 10 };
      layout();
    };
    img.src = picUrl(pic);
  }

  function layout() {
    if (!game || state.screen !== 'play') return;
    var W = window.innerWidth, H = window.innerHeight - 64, n = game.n, count = n * n;
    var landscape = W > H * 1.15;
    var S = landscape ? Math.min(H - 32, W * 0.5) : Math.min(W - 32, H * 0.56);
    var bx = landscape ? 16 : (W - S) / 2, by = landscape ? (H - S) / 2 : 12;
    var p = S / n;
    var tray = landscape ? { x: bx + S + 16, y: 12, w: W - bx - S - 32, h: H - 24 }
                         : { x: 16, y: by + S + 16, w: W - 32, h: H - by - S - 28 };
    // best tray grid for the remaining pieces
    var best = { size: 0, cols: 1 };
    for (var c = 1; c <= count; c++) {
      var rows = Math.ceil(count / c);
      var size = Math.min(tray.w / c, tray.h / rows) - 10;
      if (size > best.size) best = { size: size, cols: c };
    }
    var tp = Math.max(28, Math.min(p, best.size)), scale = tp / p;
    var cols = best.cols, rowsN = Math.ceil(count / cols);
    var ox = tray.x + (tray.w - cols * (tp + 10)) / 2 + 5, oy = tray.y + (tray.h - rowsN * (tp + 10)) / 2 + 5;

    var board = $('board'), trayEl = $('tray');
    Object.assign(board.style, { left: bx + 'px', top: by + 'px', width: S + 'px', height: S + 'px' });
    Object.assign(trayEl.style, { left: tray.x + 'px', top: tray.y + 'px', width: tray.w + 'px', height: tray.h + 'px' });
    board.innerHTML = '<img alt="" src="' + picUrl(game.pic) + '">';
    for (var s = 0; s < count; s++) {
      var slot = document.createElement('div'); slot.className = 'slot';
      Object.assign(slot.style, { left: (s % n) * p + 'px', top: Math.floor(s / n) * p + 'px', width: p + 'px', height: p + 'px' });
      board.appendChild(slot);
    }
    var play = $('play');
    Array.prototype.slice.call(play.querySelectorAll('.piece')).forEach(function (el) { el.remove(); });

    var dpr = Math.min(window.devicePixelRatio || 1, 3), srcP = game.img.width / n;
    game.geom = { bx: bx, by: by, p: p, scale: scale };
    game.order.forEach(function (pieceIdx, slotIdx) {
      var cv = document.createElement('canvas'); cv.className = 'piece';
      cv.width = Math.round(p * dpr); cv.height = Math.round(p * dpr);
      cv.style.width = p + 'px'; cv.style.height = p + 'px';
      cv.getContext('2d').drawImage(game.img, (pieceIdx % n) * srcP, Math.floor(pieceIdx / n) * srcP, srcP, srcP, 0, 0, cv.width, cv.height);
      var piece = { el: cv, idx: pieceIdx,
        home: { x: ox + (slotIdx % cols) * (tp + 10), y: oy + Math.floor(slotIdx / cols) * (tp + 10) },
        target: { x: bx + (pieceIdx % n) * p, y: by + Math.floor(pieceIdx / n) * p } };
      if (game.placed[pieceIdx]) { cv.classList.add('locked'); move(cv, piece.target.x, piece.target.y, 1); }
      else { move(cv, piece.home.x, piece.home.y, scale); bindDrag(piece); }
      play.appendChild(cv);
    });
  }

  function move(el, x, y, s) { el.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')'; }

  function bindDrag(piece) {
    var el = piece.el, g = game, dragging = false, offX = 0, offY = 0;
    el.addEventListener('pointerdown', function (e) {
      if (g.placed[piece.idx]) return;
      e.preventDefault(); dragging = true; el.setPointerCapture(e.pointerId);
      el.classList.add('drag'); el.style.zIndex = ++g.z;
      offX = g.geom.p / 2; offY = g.geom.p * 0.7; // keep the piece visible above the finger
      sfx.pick(); drag(e);
    });
    function drag(e) {
      if (!dragging) return;
      var y = e.clientY - 64;
      move(el, e.clientX - offX, y - offY, 1);
      piece.cur = { x: e.clientX - offX, y: y - offY };
    }
    el.addEventListener('pointermove', drag);
    function drop() {
      if (!dragging) return;
      dragging = false; el.classList.remove('drag');
      var c = piece.cur || piece.home, t = piece.target;
      if (Math.hypot(c.x - t.x, c.y - t.y) < g.geom.p * 0.42) {
        g.placed[piece.idx] = true; el.classList.add('locked'); el.style.zIndex = 1;
        move(el, t.x, t.y, 1); sfx.snap();
        if (Object.keys(g.placed).length === g.n * g.n) setTimeout(win, 350);
      } else {
        sfx.miss(); move(el, piece.home.x, piece.home.y, g.geom.scale);
      }
    }
    el.addEventListener('pointerup', drop);
    el.addEventListener('pointercancel', drop);
  }

  /* ---------- win ---------- */
  function win() {
    var done = store.get('done', {}); done[game.pic.id + ':' + game.n] = true; store.set('done', done);
    sfx.win(); confetti();
    $('winImg').src = picUrl(game.pic); $('winName').textContent = game.pic.name;
    $('win').classList.add('on');
  }
  function closeWin() { $('win').classList.remove('on'); }
  $('again').onclick = function () { sfx.pick(); closeWin(); startPuzzle(state.pic); };
  $('next').onclick = function () {
    sfx.pick(); closeWin();
    var list = state.theme.list, i = list.indexOf(state.pic);
    startPuzzle(list[(i + 1) % list.length]);
  };

  function confetti() {
    var cv = $('confetti'), c = cv.getContext('2d'), W = cv.width = innerWidth, H = cv.height = innerHeight;
    var colors = ['#FF8A65', '#FFD54F', '#81C784', '#4FC3F7', '#BA68C8', '#F06292'], bits = [];
    for (var i = 0; i < 120; i++) bits.push({ x: Math.random() * W, y: -Math.random() * H * 0.5, s: 6 + Math.random() * 8,
      vy: 2 + Math.random() * 3, vx: -1.5 + Math.random() * 3, r: Math.random() * 6, vr: -0.2 + Math.random() * 0.4, c: colors[i % colors.length] });
    var start = performance.now();
    (function frame(t) {
      c.clearRect(0, 0, W, H);
      bits.forEach(function (b) { b.x += b.vx; b.y += b.vy; b.r += b.vr;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.c; c.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); c.restore(); });
      if (t - start < 2800) requestAnimationFrame(frame); else c.clearRect(0, 0, W, H);
    })(start);
  }

  var resizeTimer;
  window.addEventListener('resize', function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(layout, 150); });
  openMenu();
})();
</script>
</body>
</html>
